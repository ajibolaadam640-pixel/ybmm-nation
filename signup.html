<!DOCTYPE html>
<html>
<head>
  <title>YBMM Signup</title>
  <style>
    .box { background: #222; padding: 30px; border-radius: 10px; color: white; }
    input, button { display: block; width: 250px; padding: 10px; margin: 10px 0; }
    button { background: green; color: white; font-weight: bold; border: none; }
    #message { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>YBMM NATION Signup</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="signUp()">Sign Up</button>
    <p id="message"></p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://jiasnfvengadhprpaura.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR...'; 
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function signUp() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msg = document.getElementById('message');

    msg.innerText = 'Signing up...';

    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      msg.innerText = 'Error: ' + error.message;
      msg.style.color = 'red';
      alert("ERROR: " + error.message);
    } else {
      msg.innerText = 'Success! Account created';
      msg.style.color = 'green';
    }
  }
</script>
</body>
</html>
