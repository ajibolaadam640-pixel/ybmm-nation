<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YBMM NATION Signup</title>
</head>
<body style="background:#111;color:white;text-align:center;font-family:sans-serif;padding-top:80px">

<h2>YBMM NATION Signup</h2>
<input id="email" type="email" placeholder="Enter Email" style="padding:10px;width:250px"><br><br>
<input id="password" type="password" placeholder="Password 6+ chars" style="padding:10px;width:250px"><br><br>
<button onclick="signUp()" style="padding:10px 20px;background:#00ff88;border:none;cursor:pointer">Sign Up</button>

<p id="msg" style="color:yellow;margin-top:20px"></p>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://jiasnfvengadhrpauras.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppYXNuZnZlbmdhZGhycGF1cmFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTg0NzEsImV4cCI6MjEwMzg3NDQ3MX0.YsNlKSdPvH8FtHrfURzGWTHFp4eKv1sH_gsUacN11Bg';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function signUp(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  document.getElementById('msg').innerText = 'Signing up...';
  
  const {data, error} = await supabase.auth.signUp({email, password});
  
  if(error){
    document.getElementById('msg').innerText = 'Error: ' + error.message;
  } else {
    document.getElementById('msg').innerText = 'Success! Check Supabase > Authentication > Users';
    alert('Account Created!');
  }
}
</script>
</body>
</html>
