
<!DOCTYPE html>
<html>
<head>
  <title>YBMM Sign Up</title>
  <style>
    body { background: black; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    form { background: #111; padding: 30px; border-radius: 10px; width: 300px; border: 1px solid #00ff88; }
    h1 { text-align: center; color: #00ff88; }
    input { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #00ff88; border: none; color: black; font-weight: bold; border-radius: 5px; cursor: pointer; }
    button:hover { background: #00cc6a; }
    #msg { text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <form id="signup-form">
    <h1>Join YBMM</h1>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password 6+ chars" required>
    <button type="submit">Sign Up</button>
    <div id="msg"></div>
  </form>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    
    const SUPABASE_URL = 'https://jiasnfvengadhrpauras.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_ZJaCImE49NUfIFs7S7S7NtnA_xEVCO5ri'
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      document.getElementById('msg').innerText = 'Creating account...'
      
      const { data, error } = await supabase.auth.signUp({ email, password })
      if (error) document.getElementById('msg').innerText = 'Error: ' + error.message
      else document.getElementById('msg').innerText = 'Success! Check your email'
    })
  </script>
</body>
</html>
