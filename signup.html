<!DOCTYPE html>
<html>
<head>
  <title>YBMM Signup</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #111; color: white; }
    .box { background: #222; padding: 30px; border-radius: 10px; }
    input, button { display: block; width: 250px; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
    button { background: green; color: white; font-weight: bold; cursor: pointer; }
    #message { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>YBMM NATION Signup</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="signUp()">Sign Up</button>
    <p id="message"></p>
  </div>

<script>
  const SUPABASE_URL = 'https://jiasnfvengadhrpauras.supabase.co'
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppYXNuZnZlbmdhZGhycGF1cmFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY3NzYxMzIsImV4cCI6MjA3MjM1MjEzMn0.xxxxxxxx' // REPLACE WITH YOUR ANON KEY

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  async function signUp() {
    const email = document.getElementById('email').value
    const password = document.getElementById('password').value
    const msg = document.getElementById('message')
    
    msg.innerText = 'Signing up...'
    
    const { data, error } = await supabase.auth.signUp({
      email: email,
      password: password
    })

    if (error) {
      msg.innerText = 'Error: ' + error.message
      msg.style.color = 'red'
    } else {
      msg.innerText = 'Success! Check your email or Supabase Users tab'
      msg.style.color = 'lightgreen'
    }
  }
</script>
</body>
</html>
