<html>

<input id="password" type="password" placeholder="Password" minlength="6"><br><br>
<button onclick="signUp()">Sign Up</button>
<p id="msg" style="color:yellow"></p>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://jiasnfvengadhprpaura.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppYXNuZnZlbmdhZGhycGF1cmFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTg0NzEsImV4cCI6MjEwMzg3NDQ3MX0.YsNlKSdPvH8FtHrfURzGWTHFp4eKv1sH_gsUacN11Bg';

console.log("Supabase loading...");
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function signUp(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  document.getElementById('msg').innerText = 'Signing up...';
  
  if(!email || !password){ alert("Fill email and password"); return; }
  if(password.length < 6){ alert("Password must be 6+ characters"); return; }

  const {data, error} = await supabase.auth.signUp({email,password});
  console.log(data, error);
  
  if(error){
    document.getElementById('msg').innerText='Error: '+error.message;
    alert('Error: '+error.message)
  }else{
    document.getElementById('msg').innerText='Success! Check Supabase > Authentication > Users';
    alert('Success! Go check Supabase')
  }
}
</script>
