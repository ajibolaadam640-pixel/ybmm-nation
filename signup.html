<!DOCTYPE html>
<html>
<head>
  <title>YBMM Sign Up</title>
  <style>
    body { background: black; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
    form { background: #111; padding: 30px; border-radius: 10px; width: 300px; }
    input { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #333; color: white; border-radius: 5px; }
    button { width: 100%; padding: 12px; background: #00ff88; border: none; color: black; font-weight: bold; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <form id="signup-form">
    <h1>Join YBMM</h1>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Sign Up</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'YOUR_URL_HERE'
    const SUPABASE_KEY = 'YOUR_KEY_HERE'
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      
      const { error } = await supabase.auth.signUp({ email, password })
      if (error) alert(error.message)
      else alert('Check your email to confirm!')
    })
  </script>
</body>
</html>
